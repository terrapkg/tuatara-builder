name: Docker Publish
permissions:
  contents: read
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0/2 * * *"
  push:
    branches: ["tumbleweed"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        branch: ["tumbleweed"]
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      publish: ${{ github.event_name != 'pull_request' }}
      ref: ${{ matrix.branch }}
      artifact_name: digests-${{ matrix.branch }}
      tags: |
        type=raw,value=${{ matrix.branch }}
        type=schedule,pattern=${{ matrix.branch }}-{{date 'X'}}
        type=schedule,pattern=nightly-{{date 'X'}}
